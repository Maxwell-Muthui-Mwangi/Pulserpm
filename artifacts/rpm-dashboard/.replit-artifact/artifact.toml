kind = "web"
previewPath = "/"
title = "RPM Healthcare Dashboard"
version = "1.0.0"
id = "artifacts/rpm-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24214

[services.development]
run = "pnpm --filter @workspace/rpm-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rpm-dashboard", "run", "build" ]
publicDir = "artifacts/rpm-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24214"
BASE_PATH = "/"
