<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- =========================================================
       PRIMARY SEO
       ========================================================= -->

  <title>
    PulseRPM | Remote Patient Monitoring & Healthcare Platform
  </title>

  <meta
    name="description"
    content="PulseRPM is a remote patient monitoring platform that helps healthcare teams collect, manage and visualize patient health data from connected wearable devices."
  />

  <meta
    name="author"
    content="PulseRPM"
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta
    name="googlebot"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <!-- Replace with your real production URL -->
  <link
    rel="canonical"
    href="https://YOUR-PULSERPM-DOMAIN.com/"
  />

  <!-- =========================================================
       BRAND / APPLICATION
       ========================================================= -->

  <meta
    name="application-name"
    content="PulseRPM"
  />

  <meta
    name="theme-color"
    content="#0B5ED7"
  />

  <meta
    name="color-scheme"
    content="light"
  />

  <!-- =========================================================
       FAVICON
       ========================================================= -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />

  <link
    rel="apple-touch-icon"
    href="/apple-touch-icon.png"
  />

  <!-- =========================================================
       OPEN GRAPH
       ========================================================= -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="PulseRPM | Remote Patient Monitoring & Healthcare Platform"
  />

  <meta
    property="og:description"
    content="Collect, manage and visualize patient health data through a connected remote patient monitoring platform."
  />

  <meta
    property="og:url"
    content="https://YOUR-PULSERPM-DOMAIN.com/"
  />

  <meta
    property="og:site_name"
    content="PulseRPM"
  />

  <meta
    property="og:image"
    content="https://YOUR-PULSERPM-DOMAIN.com/og-image.png"
  />

  <meta
    property="og:image:alt"
    content="PulseRPM Remote Patient Monitoring Healthcare Dashboard"
  />

  <meta
    property="og:locale"
    content="en_US"
  />

  <!-- =========================================================
       X / TWITTER
       ========================================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="PulseRPM | Remote Patient Monitoring & Healthcare Platform"
  />

  <meta
    name="twitter:description"
    content="A connected healthcare platform for remote patient monitoring, wearable health data and patient health insights."
  />

  <meta
    name="twitter:image"
    content="https://YOUR-PULSERPM-DOMAIN.com/og-image.png"
  />

  <meta
    name="twitter:image:alt"
    content="PulseRPM Remote Patient Monitoring Platform"
  />

  <!-- =========================================================
       PERFORMANCE
       ========================================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <!-- Keep only fonts actually used by the PulseRPM interface -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  />

  <!-- =========================================================
       STRUCTURED DATA
       ========================================================= -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "PulseRPM",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Web",
    "description": "PulseRPM is a remote patient monitoring platform for collecting, managing and visualizing patient health data from connected wearable devices.",
    "url": "https://YOUR-PULSERPM-DOMAIN.com/",
    "image": "https://YOUR-PULSERPM-DOMAIN.com/og-image.png",
    "author": {
      "@type": "Organization",
      "name": "PulseRPM"
    }
  }
  </script>

</head>

<body>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
