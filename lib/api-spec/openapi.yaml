              heart_rate_high,
              heart_rate_low,
              bp_high,
              bp_low,
              spo2_low,
              glucose_high,
              glucose_low,
            ]
        severity:
          type: string
          enum: [warning, critical]
        status:
          type: string
          enum: [active, acknowledged, resolved]
        value:
          type: number
        threshold:
          type: number
        vitalType:
          type: string
        message:
          type: string
        triggeredAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: ["string", "null"]
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - patientId
        - alertType
        - severity
        - status
        - value
        - threshold
        - message
        - createdAt

    AlertWithPatient:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        alertType:
          type: string
        vitalType:
          type: string
        severity:
          type: string
          enum: [warning, critical]
        status:
          type: string
          enum: [active, acknowledged, resolved]
        value:
          type: number
        threshold:
          type: number
        message:
          type: string
        triggeredAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
