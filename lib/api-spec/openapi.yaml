          type: ["number", "null"]
        spo2:
          type: ["number", "null"]
        temperature:
          type: ["number", "null"]
        caloriesBurned:
          type: ["number", "null"]
        recordedAt:
          type: ["string", "null"]
          format: date-time

    IngestVitalsRequest:
      type: object
      properties:
        heartRate:
          type: ["number", "null"]
        systolicBp:
          type: ["number", "null"]
        diastolicBp:
          type: ["number", "null"]
        spo2:
          type: ["number", "null"]
        caloriesBurned:
          type: ["number", "null"]
        steps:
          type: ["integer", "null"]
        glucoseLevel:
          type: ["number", "null"]
        weight:
          type: ["number", "null"]
        temperature:
          type: ["number", "null"]
        source:
          type: string
          enum: [apple_health, google_fit, fitbit, garmin, manual]
          default: manual
        recordedAt:
          type: string
          format: date-time

    IngestVitalsResponse:
      type: object
