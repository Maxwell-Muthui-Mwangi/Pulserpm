openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Remote Patient Monitoring API + Academic Assignment Scheduler API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: patients
    description: Patient management
  - name: providers
    description: Provider management
  - name: vitals
    description: Vitals readings
  - name: alerts
    description: Alert management
  - name: thresholds
    description: Threshold configuration
  - name: summary
    description: Summary and analytics
  - name: scheduler-auth
    description: Tutor authentication
  - name: scheduler-students
    description: Student management
  - name: scheduler-classes
    description: Class management
  - name: scheduler-assignments
    description: Assignment management
  - name: scheduler-payments
    description: Payment tracking
  - name: scheduler-dashboard
    description: Dashboard & analytics
  - name: scheduler-search
    description: Search & export

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new provider or patient account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login for providers and patients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all providers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Create a new provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients (optionally filtered by provider)
      security:
        - bearerAuth: []
      parameters:
        - name: providerId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: riskLevel
          in: query
          schema:
            type: string
            enum: [normal, warning, critical]
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientSummary"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{patientId}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient by ID
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientDetail"
        "404":
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
      responses:
        "200":
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{patientId}/vitals:
    get:
      operationId: getPatientVitals
      tags: [vitals]
      summary: Get vitals history for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Vitals history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VitalsReading"
    post:
      operationId: ingestVitals
      tags: [vitals]
      summary: Ingest vitals data for a patient (from wearable or manual input)
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestVitalsRequest"
      responses:
        "201":
          description: Vitals ingested and alerts evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestVitalsResponse"

  /patients/{patientId}/vitals/latest:
    get:
      operationId: getLatestVitals
      tags: [vitals]
      summary: Get the most recent vitals for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest vitals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalsReading"
        "404":
          description: No vitals found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{patientId}/summary:
    get:
      operationId: getPatientSummary
      tags: [summary]
      summary: Get daily summary stats for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientDailySummary"

  /patients/{patientId}/thresholds:
    get:
      operationId: getPatientThresholds
      tags: [thresholds]
      summary: Get alert thresholds for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Threshold configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalThresholds"
    put:
      operationId: updatePatientThresholds
      tags: [thresholds]
      summary: Update alert thresholds for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThresholdsRequest"
      responses:
        "200":
          description: Thresholds updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalThresholds"

  /patients/{patientId}/alerts:
    get:
      operationId: getPatientAlerts
      tags: [alerts]
      summary: Get alerts for a patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, acknowledged, resolved]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List all alerts across all patients
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, acknowledged, resolved]
        - name: severity
          in: query
          schema:
            type: string
            enum: [warning, critical]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertWithPatient"

  /alerts/{alertId}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      summary: Acknowledge an alert
      security:
        - bearerAuth: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{alertId}/resolve:
    post:
      operationId: resolveAlert
      tags: [alerts]
      summary: Resolve an alert
      security:
        - bearerAuth: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /vitals/ingest-batch:
    post:
      operationId: ingestVitalsBatch
      tags: [vitals]
      summary: Batch ingest vitals for multiple patients (wearable sync)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIngestRequest"
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchIngestResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [summary]
      summary: Get aggregate stats for the provider dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ===== ACADEMIC SCHEDULER ENDPOINTS =====

  /scheduler/auth/signup:
    post:
      operationId: schedulerSignup
      tags: [scheduler-auth]
      summary: Register a new tutor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulerSignupRequest"
      responses:
        "201":
          description: Tutor account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAuthResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scheduler/auth/login:
    post:
      operationId: schedulerLogin
      tags: [scheduler-auth]
      summary: Login as tutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulerLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scheduler/auth/me:
    get:
      operationId: schedulerGetMe
      tags: [scheduler-auth]
      summary: Get current tutor info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerTutor"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scheduler/students:
    get:
      operationId: listSchedulerStudents
      tags: [scheduler-students]
      summary: List all students
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
        - name: paymentStatus
          in: query
          schema:
            type: string
            enum: [paid, pending, overdue]
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerStudent"
    post:
      operationId: createSchedulerStudent
      tags: [scheduler-students]
      summary: Create a new student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedulerStudentRequest"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStudent"

  /scheduler/students/{studentId}:
    get:
      operationId: getSchedulerStudent
      tags: [scheduler-students]
      summary: Get student profile with assignments and stats
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStudentProfile"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateSchedulerStudent
      tags: [scheduler-students]
      summary: Update a student
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedulerStudentRequest"
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStudent"
    delete:
      operationId: deleteSchedulerStudent
      tags: [scheduler-students]
      summary: Archive a student
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Student archived

  /scheduler/classes:
    get:
      operationId: listSchedulerClasses
      tags: [scheduler-classes]
      summary: List all classes
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerClass"
    post:
      operationId: createSchedulerClass
      tags: [scheduler-classes]
      summary: Create a new class (semester-long recurring)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedulerClassRequest"
      responses:
        "201":
          description: Class created with recurring assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerClass"

  /scheduler/classes/{classId}:
    get:
      operationId: getSchedulerClass
      tags: [scheduler-classes]
      summary: Get a class by ID
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerClass"
        "404":
          description: Class not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateSchedulerClass
      tags: [scheduler-classes]
      summary: Update a class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedulerClassRequest"
      responses:
        "200":
          description: Class updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerClass"
    delete:
      operationId: deleteSchedulerClass
      tags: [scheduler-classes]
      summary: Delete a class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Class deleted

  /scheduler/assignments:
    get:
      operationId: listSchedulerAssignments
      tags: [scheduler-assignments]
      summary: List assignments with filters
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: classId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, in_progress, completed, submitted]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerAssignment"
    post:
      operationId: createSchedulerAssignment
      tags: [scheduler-assignments]
      summary: Create a new assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedulerAssignmentRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAssignment"

  /scheduler/assignments/{assignmentId}:
    get:
      operationId: getSchedulerAssignment
      tags: [scheduler-assignments]
      summary: Get an assignment by ID
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAssignment"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateSchedulerAssignment
      tags: [scheduler-assignments]
      summary: Update an assignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedulerAssignmentRequest"
      responses:
        "200":
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAssignment"
    delete:
      operationId: deleteSchedulerAssignment
      tags: [scheduler-assignments]
      summary: Delete an assignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Assignment deleted

  /scheduler/assignments/{assignmentId}/status:
    patch:
      operationId: updateSchedulerAssignmentStatus
      tags: [scheduler-assignments]
      summary: Update assignment status
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAssignment"

  /scheduler/assignments/{assignmentId}/reschedule:
    patch:
      operationId: rescheduleAssignment
      tags: [scheduler-assignments]
      summary: Reschedule an assignment (drag-and-drop)
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleAssignmentRequest"
      responses:
        "200":
          description: Assignment rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerAssignment"

  /scheduler/payments:
    get:
      operationId: listSchedulerPayments
      tags: [scheduler-payments]
      summary: List all payment records
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, overdue]
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerPayment"
    post:
      operationId: createSchedulerPayment
      tags: [scheduler-payments]
      summary: Create a payment record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedulerPaymentRequest"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerPayment"

  /scheduler/payments/{paymentId}:
    put:
      operationId: updateSchedulerPayment
      tags: [scheduler-payments]
      summary: Update a payment record
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedulerPaymentRequest"
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerPayment"
    delete:
      operationId: deleteSchedulerPayment
      tags: [scheduler-payments]
      summary: Delete a payment record
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Payment deleted

  /scheduler/dashboard:
    get:
      operationId: getSchedulerDashboard
      tags: [scheduler-dashboard]
      summary: Get dashboard data (stats, today, upcoming, urgent)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerDashboard"

  /scheduler/dashboard/heatmap:
    get:
      operationId: getSchedulerHeatmap
      tags: [scheduler-dashboard]
      summary: Get workload heatmap data (daily assignment counts)
      security:
        - bearerAuth: []
      parameters:
        - name: weeks
          in: query
          schema:
            type: integer
            default: 16
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapDay"

  /scheduler/search:
    get:
      operationId: schedulerSearch
      tags: [scheduler-search]
      summary: Global search across students and assignments
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerSearchResults"

  /scheduler/export/assignments:
    get:
      operationId: exportSchedulerAssignments
      tags: [scheduler-search]
      summary: Export assignments as CSV
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /scheduler/calendar:
    get:
      operationId: getSchedulerCalendar
      tags: [scheduler-assignments]
      summary: Get assignments for calendar view (monthly range)
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Calendar assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerAssignment"

  /scheduler/weekly:
    get:
      operationId: getSchedulerWeekly
      tags: [scheduler-assignments]
      summary: Get assignments for weekly planner view
      security:
        - bearerAuth: []
      parameters:
        - name: weekStart
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulerAssignment"

  /scheduler/earnings:
    get:
      operationId: getSchedulerEarnings
      tags: [scheduler-payments]
      summary: Get earnings summary
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Earnings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerEarnings"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SignupRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [provider, patient]
          default: provider
        specialty:
          type: string
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - token
        - user

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [provider, admin, patient]
      required:
        - id
        - email
        - name
        - role

    Provider:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        specialty:
          type: string
        patientCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - patientCount
        - createdAt

    CreateProviderRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        specialty:
          type: string
      required:
        - name
        - email
        - password

    Patient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        conditions:
          type: array
          items:
            type: string
        providerId:
          type: integer
        deviceType:
          type: string
          enum: [apple_health, google_fit, fitbit, garmin, manual]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - createdAt

    PatientSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        age:
          type: integer
        conditions:
          type: array
          items:
            type: string
        riskLevel:
          type: string
          enum: [normal, warning, critical]
        latestVitals:
          $ref: "#/components/schemas/VitalsSnapshot"
        activeAlertCount:
          type: integer
        lastSeen:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - riskLevel
        - activeAlertCount

    PatientDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        conditions:
          type: array
          items:
            type: string
        providerId:
          type: integer
        deviceType:
          type: string
        riskLevel:
          type: string
          enum: [normal, warning, critical]
        latestVitals:
          $ref: "#/components/schemas/VitalsSnapshot"
        thresholds:
          $ref: "#/components/schemas/VitalThresholds"
        activeAlertCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - riskLevel
        - activeAlertCount
        - createdAt

    CreatePatientRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        conditions:
          type: array
          items:
            type: string
        providerId:
          type: integer
        deviceType:
          type: string
          enum: [apple_health, google_fit, fitbit, garmin, manual]
      required:
        - name
        - email
        - password

    UpdatePatientRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        conditions:
          type: array
          items:
            type: string
